[project]
name = "perceptual-media"
version = "0.1.0"
description = "Perceptually lossless, camera-readable payload embedding for still images (research harness)"
readme = "README.md"
authors = [
    { name = "RuffledZest", email = "vibhanshalok@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "galois>=0.4.11",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
pm-run = "perceptual_media.harness.cli:main"
pm-corpus = "perceptual_media.corpus.build:main"
pm-plot = "perceptual_media.harness.plots:main"
pm-compare = "perceptual_media.harness.compare:main"
pm-capture = "perceptual_media.capture.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
# Week 3 learned baseline (facebookresearch/videoseal). Install with `uv sync --extra videoseal`.
videoseal = ["videoseal>=1.0.1", "requests>=2.31"]  # requests: used by videoseal.load but not declared

[tool.uv]
# videoseal declares `decord` (video decoding, unmaintained, no py3.13 Windows wheel); it is not
# needed for image embed/detect. Override it to a never-matching marker.
override-dependencies = ["decord ; sys_platform == 'never'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
