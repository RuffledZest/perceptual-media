# Smoke test for the harness: NullMarker through the identity chain.
# Expected: BER ~0.5, AUC ~0.5, every ResultRow column populated (fidelity from Task 7).
# print_camera / screen_camera presets are added here in Task 12.
name: smoke
seed: 0

corpus:
  manifest: data/corpus/manifest.csv
  limit: 8

marker:
  name: "null"
  n_bits: 64

distortions:
  - preset: identity
    severity: 0.0

strengths: [1.0]
control: true
output_dir: outputs
device: auto
